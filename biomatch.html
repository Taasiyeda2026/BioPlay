<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ביומימיקרי</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    * { box-sizing: border-box; }

    :root {
      --number-size: 34px;
    }

    body {
      font-family: 'Rubik', sans-serif;
      direction: rtl;
      background: #050f1c;
      color: #e8f8ff;
    }

    .nature-card, .tech-card {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .nature-card:hover, .tech-card:hover {
      transform: translateY(-3px);
    }

    .nature-card.selected, .tech-card.selected {
      box-shadow: 0 0 0 3px #88f3b9, 0 8px 25px rgba(136,243,185,0.25);
      transform: translateY(-3px);
      border-color: #88f3b9 !important;
    }

    .nature-card.matched,
    .tech-card.matched {
      opacity: 0.72;
      pointer-events: none;
    }

    .nature-card.correct-flash,
    .tech-card.correct-flash {
      animation: correctPulse 0.6s ease;
    }

    .nature-card.wrong-flash,
    .tech-card.wrong-flash {
      animation: wrongShake 0.5s ease;
    }

    @keyframes correctPulse {
      0% { box-shadow: 0 0 0 0 rgba(136,243,185,0.7); }
      50% { box-shadow: 0 0 0 12px rgba(136,243,185,0); }
      100% { box-shadow: 0 0 0 0 rgba(136,243,185,0); }
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    svg.lines-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }

    .scattered-numbers-layer {
      position: absolute;
      inset: 0;
      z-index: 25;
      pointer-events: none;
    }

    .scattered-number {
      position: absolute;
      width: var(--number-size);
      height: var(--number-size);
      border-radius: 999px;
      background: rgba(98,217,255,0.12);
      border: 2px solid #62d9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #62d9ff;
      box-shadow: 0 0 10px rgba(98,217,255,0.25);
      transform: translate(-50%, -50%);
    }

    svg.lines-svg path {
      stroke-dasharray: 8 4;
      animation: dashMove 1s linear infinite;
      stroke-linecap: round;
      fill: none;
      stroke-linejoin: round;
    }

    svg.lines-svg path.animating {
      animation: drawLine 0.6s ease-out forwards;
      stroke-dasharray: none;
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -24; }
    }

    @keyframes drawLine {
      from {
        stroke-dasharray: 100%;
        stroke-dashoffset: 100%;
        opacity: 0;
      }
      to {
        stroke-dasharray: 0;
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    .score-bar { transition: width 0.5s ease; }

    .card-image {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(98,217,255,0.2);
      background: #0d2235;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeInUp 0.5s ease forwards;
      opacity: 0;
    }

    .completion-overlay {
      animation: fadeInUp 0.4s ease;
    }

    @media (max-width: 768px) {
      .card-image {
        width: 46px;
        height: 46px;
      }

      :root {
        --number-size: 30px;
      }
    }
  </style>
</head>
<body class="h-full">
  <div id="app-wrapper" class="w-full h-full overflow-auto" style="background: linear-gradient(160deg, #050f1c 0%, #0a1a2a 60%, #05101e 100%);">
    <header class="text-center pt-6 pb-3 px-4">
      <div class="inline-flex items-center gap-2 mb-2">
        <span style="font-size:32px;">🌿</span>
        <h1 id="main-title" class="text-2xl md:text-3xl font-extrabold" style="color: #88f3b9;">ביומימיקרי</h1>
        <span style="font-size:32px;">⚙️</span>
      </div>
      <p id="subtitle" class="text-base md:text-lg font-medium" style="color: #b0e8ff;">התאמה בין השראה מהטבע לטכנולוגיה</p>
      <p id="instructions" class="text-sm mt-1" style="color: rgba(176,232,255,.65);">לחצו על תמונה מהטבע ואז על ההמצאה המתאימה כדי לחבר ביניהן בקו</p>
    </header>

    <div class="flex justify-center px-4 mb-4">
      <div class="flex items-center gap-3 px-5 py-2 rounded-full" style="background: rgba(13,34,53,.8); border:1px solid rgba(98,217,255,.18); backdrop-filter: blur(8px);">
        <span class="text-sm font-semibold" style="color: #88f3b9;">התאמות:</span>
        <span id="score-text" class="font-bold" style="color: #88f3b9;">0 / 6</span>
        <div class="w-32 h-2 rounded-full overflow-hidden" style="background: rgba(98,217,255,.15);">
          <div id="score-bar" class="score-bar h-full rounded-full" style="background: linear-gradient(90deg,#88f3b9,#62d9ff); width: 0%;"></div>
        </div>
        <button id="reset-btn" class="mr-2 p-1.5 rounded-full transition-colors" style="background: rgba(98,217,255,.1); color: #62d9ff;" title="אתחול">
          <i data-lucide="rotate-ccw" style="width:16px;height:16px;"></i>
        </button>
      </div>
    </div>

    <main class="relative px-4 pb-8">
      <div id="game-container" class="relative flex justify-center items-start gap-4 md:gap-8 max-w-5xl mx-auto" style="min-height: 560px;">
        <div class="flex flex-col gap-3 z-20" id="nature-col">
          <div class="text-center mb-1">
            <span class="inline-flex items-center justify-center w-28 px-3 py-1 rounded-full text-xs font-bold" style="background: rgba(136,243,185,.15); border:1px solid rgba(136,243,185,.4); color: #88f3b9;">🌱 טבע</span>
          </div>
        </div>

        <svg id="lines-svg" class="lines-svg"></svg>

        <div class="w-20 md:w-40 flex-shrink-0" aria-hidden="true"></div>

        <div class="flex flex-col gap-3 z-20" id="tech-col">
          <div class="text-center mb-1">
            <span class="inline-flex items-center justify-center w-28 px-3 py-1 rounded-full text-xs font-bold" style="background: rgba(98,217,255,.12); border:1px solid rgba(98,217,255,.35); color: #62d9ff;">🔧 טכנולוגיה</span>
          </div>
        </div>

        <div id="numbers-layer" class="scattered-numbers-layer"></div>
      </div>

      <div id="completion-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center" style="background: rgba(2,8,20,.78); backdrop-filter:blur(6px);">
        <div class="completion-overlay text-center p-8 rounded-2xl mx-4" style="background: linear-gradient(160deg,#0d2235,#0a1a2a); border:1.5px solid rgba(136,243,185,.3); box-shadow:0 8px 40px rgba(0,0,0,.6),0 0 40px rgba(136,243,185,.1); max-width: 400px;">
          <div style="font-size: 64px;">🎉</div>
          <h2 class="text-2xl font-extrabold mt-3" style="color: #88f3b9;">כל הכבוד!</h2>
          <p class="mt-2" style="color: rgba(176,232,255,.8);">התאמתם בהצלחה את כל הזוגות!</p>
          <p id="secret-code-message" class="mt-3 text-base font-bold" style="color: #62d9ff;"></p>
          <div class="mt-5 flex items-center justify-center gap-3 flex-wrap">
            <button id="continue-btn" class="px-5 py-2 rounded-full text-sm font-bold transition-colors" style="background: rgba(98,217,255,.15); border:1px solid rgba(98,217,255,.4); color:#62d9ff;">המשך</button>
            <button id="play-again-btn" class="px-6 py-2.5 rounded-full font-bold text-white transition-colors" style="background: linear-gradient(135deg,#88f3b9,#62d9ff); color:#0a1520;">שחקו שוב</button>
          </div>
        </div>
      </div>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full font-bold text-sm transition-all duration-300 opacity-0 pointer-events-none" style="background: rgba(13,34,53,.95); border:1px solid rgba(136,243,185,.35); color:#88f3b9;"></div>
  </div>

  <script>
    const PAIRS = [
      { id: 1, nature: { image: 'images/mat1.png', label: 'סנפיר לווייתן' }, tech: { image: 'images/mat7.png', label: 'טורבינת רוח' }, info: 'צורת הסנפיר משפרת זרימת אוויר' },
      { id: 2, nature: { image: 'images/mat2.png', label: 'פרפר מורפו' }, tech: { image: 'images/mat8.png', label: 'צבעים מחליפי גוון' }, info: 'מבנה מיקרוסקופי יוצר צבעים' },
      { id: 3, nature: { image: 'images/mat3.png', label: 'כריש' }, tech: { image: 'images/mat9.png', label: 'חליפת שחייה' }, info: 'טקסטורת העור מפחיתה חיכוך' },
      { id: 4, nature: { image: 'images/mat4.png', label: 'פנגולין' }, tech: { image: 'images/mat10.png', label: 'שריון' }, info: 'מבנה הקשקשים יוצר הגנה יעילה' },
      { id: 5, nature: { image: 'images/mat5.png', label: 'קורי עכביש' }, tech: { image: 'images/mat11.png', label: 'גשר' }, info: 'חוזק מבני עם גמישות' },
      { id: 6, nature: { image: 'images/mat6.png', label: 'עלה לוטוס' }, tech: { image: 'images/mat12.png', label: 'משטח דוחה מים' }, info: 'אפקט הלוטוס - ניקוי עצמי' }
    ];

    const SECRET_CODE_NUMBERS = [3, 4];

    let selectedCard = null;
    let selectedSide = null;
    let matchedIds = new Set();
    let lines = [];
    let natureOrder = [];
    let techOrder = [];

    const defaultConfig = {
      main_title: 'ביומימיקרי',
      subtitle: 'התאמה בין השראה מהטבע לטכנולוגיה',
      instructions: 'לחצו על תמונה מהטבע ואז על ההמצאה המתאימה כדי לחבר ביניהן בקו',
      background_color: '#050f1c',
      surface_color: '#0d2235',
      text_color: '#88f3b9',
      primary_action: '#88f3b9',
      secondary_action: '#62d9ff'
    };

    function getSecretCodeMessage() {
      return `2 המספרים של הקוד הסודי הם: ${SECRET_CODE_NUMBERS.join(', ')}`;
    }

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.background = isError ? 'rgba(180,30,30,.9)' : 'rgba(13,34,53,.95)';
      toast.style.borderColor = isError ? 'rgba(255,80,80,.4)' : 'rgba(136,243,185,.35)';
      toast.style.color = isError ? '#ffb3b3' : '#88f3b9';
      toast.style.opacity = '1';
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        toast.style.opacity = '0';
      }, 1800);
    }

    function buildCards() {
      natureOrder = shuffleArray(PAIRS);
      techOrder = shuffleArray(PAIRS);

      const natureCol = document.getElementById('nature-col');
      const techCol = document.getElementById('tech-col');

      const natureHeader = natureCol.firstElementChild;
      const techHeader = techCol.firstElementChild;

      natureCol.innerHTML = '';
      techCol.innerHTML = '';
      natureCol.appendChild(natureHeader);
      techCol.appendChild(techHeader);

      natureOrder.forEach((pair, i) => {
        const card = document.createElement('div');
        card.className = 'nature-card animate-in flex items-center gap-2 p-2.5 rounded-xl relative';
        card.style.cssText = `background: rgba(10,26,42,.85); border: 2px solid rgba(136,243,185,.25); animation-delay: ${i * 0.05}s; min-width: 150px; box-shadow: 0 2px 12px rgba(0,0,0,.3);`;
        card.dataset.id = String(pair.id);
        card.innerHTML = `<img class="card-image" src="${pair.nature.image}" alt="${pair.nature.label}"><span class="text-xs font-semibold" style="color: #e8f8ff;">${pair.nature.label}</span>`;
        card.addEventListener('click', () => selectNature(card, pair.id));
        natureCol.appendChild(card);
      });

      techOrder.forEach((pair, i) => {
        const card = document.createElement('div');
        card.className = 'tech-card animate-in flex items-center gap-2 p-2.5 rounded-xl relative';
        card.style.cssText = `background: rgba(10,26,42,.85); border: 2px solid rgba(98,217,255,.22); animation-delay: ${i * 0.05 + 0.2}s; min-width: 150px; box-shadow: 0 2px 12px rgba(0,0,0,.3);`;
        card.dataset.id = String(pair.id);
        card.innerHTML = `<img class="card-image" src="${pair.tech.image}" alt="${pair.tech.label}"><span class="text-xs font-semibold" style="color: #e8f8ff;">${pair.tech.label}</span>`;
        card.addEventListener('click', () => selectTech(card, pair.id));
        techCol.appendChild(card);
      });

      requestAnimationFrame(() => {
        generateScatteredNumbers();
        redrawLines();
      });
    }

    function generateScatteredNumbers() {
      const numbersLayer = document.getElementById('numbers-layer');
      const container = document.getElementById('game-container');
      numbersLayer.innerHTML = '';

      const rect = container.getBoundingClientRect();
      const containerWidth = rect.width;
      const containerHeight = Math.max(rect.height, 520);
      const centerX = containerWidth / 2;
      const isMobile = window.innerWidth <= 768;

      const sideOffset = isMobile ? 54 : 78;
      const centerOffset = isMobile ? 12 : 16;

      const positions = [
        { x: centerX - sideOffset, y: containerHeight * 0.12 },
        { x: centerX + sideOffset, y: containerHeight * 0.24 },
        { x: centerX - centerOffset, y: containerHeight * 0.43 },
        { x: centerX + centerOffset, y: containerHeight * 0.57 },
        { x: centerX - sideOffset, y: containerHeight * 0.76 },
        { x: centerX + sideOffset, y: containerHeight * 0.88 }
      ];

      positions.forEach((pos, index) => {
        const number = index + 1;
        const el = document.createElement('div');
        el.className = 'scattered-number';
        el.textContent = String(number);
        el.dataset.number = String(number);

        el.style.left = `${pos.x}px`;
        el.style.top = `${pos.y}px`;
        numbersLayer.appendChild(el);
      });
    }

    function clearSelections() {
      document.querySelectorAll('.nature-card, .tech-card').forEach(card => card.classList.remove('selected'));
      selectedCard = null;
      selectedSide = null;
    }

    function selectNature(card, id) {
      if (matchedIds.has(id)) return;

      if (selectedCard === card) {
        clearSelections();
        return;
      }

      if (selectedSide === 'nature') {
        document.querySelectorAll('.nature-card').forEach(c => c.classList.remove('selected'));
      } else if (selectedSide === 'tech' && selectedCard) {
        const techId = Number(selectedCard.dataset.id);
        checkMatch(selectedCard, card, techId, id);
        return;
      }

      card.classList.add('selected');
      selectedCard = card;
      selectedSide = 'nature';
    }

    function selectTech(card, techId) {
      if (matchedIds.has(techId)) return;

      if (selectedCard === card) {
        clearSelections();
        return;
      }

      if (selectedSide === 'tech') {
        document.querySelectorAll('.tech-card').forEach(c => c.classList.remove('selected'));
      } else if (selectedSide === 'nature' && selectedCard) {
        const natureId = Number(selectedCard.dataset.id);
        checkMatch(selectedCard, card, techId, natureId);
        return;
      }

      card.classList.add('selected');
      selectedCard = card;
      selectedSide = 'tech';
    }

    function checkMatch(firstCard, secondCard, techId, natureId) {
      if (natureId === techId) {
        matchedIds.add(natureId);
        clearSelections();

        firstCard.classList.add('matched', 'correct-flash');
        secondCard.classList.add('matched', 'correct-flash');
        firstCard.style.borderColor = '#88f3b9';
        secondCard.style.borderColor = '#88f3b9';

        const natureCard = firstCard.classList.contains('nature-card') ? firstCard : secondCard;
        const techCard = firstCard.classList.contains('tech-card') ? firstCard : secondCard;

        drawLine(natureCard, techCard, natureId);

        const pair = PAIRS.find(p => p.id === natureId);
        if (pair) showToast(`✓ ${pair.info}`);

        updateScore();

        if (matchedIds.size === PAIRS.length) {
          generateScatteredNumbers();
          redrawLines();
          setTimeout(() => {
            document.getElementById('completion-overlay').classList.remove('hidden');
          }, 800);
        }
      } else {
        firstCard.classList.add('wrong-flash');
        secondCard.classList.add('wrong-flash');
        showToast('✗ נסו שוב!', true);
        setTimeout(() => {
          firstCard.classList.remove('wrong-flash');
          secondCard.classList.remove('wrong-flash');
          clearSelections();
        }, 500);
      }
    }

    function getNumberCenter(number) {
      const container = document.getElementById('game-container');
      const containerRect = container.getBoundingClientRect();
      const el = document.querySelector(`.scattered-number[data-number="${number}"]`);
      if (!el) return null;
      const rect = el.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2 - containerRect.left,
        y: rect.top + rect.height / 2 - containerRect.top
      };
    }

    function buildSecretPathD(x1, y1, x2, y2) {
      if (matchedIds.size !== PAIRS.length) {
        return `M ${x1} ${y1} L ${x2} ${y2}`;
      }

      const anchorA = getNumberCenter(3);
      const anchorB = getNumberCenter(4);

      if (!anchorA || !anchorB) {
        return `M ${x1} ${y1} L ${x2} ${y2}`;
      }

      const midBeforeA = (x1 + anchorA.x) / 2;
      const midAfterB = (anchorB.x + x2) / 2;

      return [
        `M ${x1} ${y1}`,
        `C ${midBeforeA} ${y1}, ${midBeforeA} ${anchorA.y}, ${anchorA.x} ${anchorA.y}`,
        `L ${anchorB.x} ${anchorB.y}`,
        `C ${midAfterB} ${anchorB.y}, ${midAfterB} ${y2}, ${x2} ${y2}`
      ].join(' ');
    }

    function drawLine(fromEl, toEl, id) {
      const svg = document.getElementById('lines-svg');
      const container = document.getElementById('game-container');
      const containerRect = container.getBoundingClientRect();
      const fromRect = fromEl.getBoundingClientRect();
      const toRect = toEl.getBoundingClientRect();
      const cfg = window.elementSdk ? window.elementSdk.config : defaultConfig;

      const x1 = fromRect.left + fromRect.width / 2 - containerRect.left;
      const y1 = fromRect.top + fromRect.height / 2 - containerRect.top;
      const x2 = toRect.left + toRect.width / 2 - containerRect.left;
      const y2 = toRect.top + toRect.height / 2 - containerRect.top;

      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      group.setAttribute('pointer-events', 'none');

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', buildSecretPathD(x1, y1, x2, y2));
      path.setAttribute('stroke', cfg.primary_action || defaultConfig.primary_action);
      path.setAttribute('stroke-width', '2.5');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      path.dataset.pairId = String(id);
      path.classList.add('animating');

      group.appendChild(path);
      svg.appendChild(group);
      lines.push({ id, fromEl, toEl, path });
    }

    function redrawLines() {
      const container = document.getElementById('game-container');
      const containerRect = container.getBoundingClientRect();
      const cfg = window.elementSdk ? window.elementSdk.config : defaultConfig;

      lines.forEach(item => {
        const fromRect = item.fromEl.getBoundingClientRect();
        const toRect = item.toEl.getBoundingClientRect();
        const x1 = fromRect.left + fromRect.width / 2 - containerRect.left;
        const y1 = fromRect.top + fromRect.height / 2 - containerRect.top;
        const x2 = toRect.left + toRect.width / 2 - containerRect.left;
        const y2 = toRect.top + toRect.height / 2 - containerRect.top;

        item.path.setAttribute('d', buildSecretPathD(x1, y1, x2, y2));
        item.path.setAttribute('stroke', cfg.primary_action || defaultConfig.primary_action);
      });
    }

    function updateScore() {
      const count = matchedIds.size;
      document.getElementById('score-text').textContent = `${count} / ${PAIRS.length}`;
      document.getElementById('score-bar').style.width = `${(count / PAIRS.length) * 100}%`;
    }

    function resetGame() {
      matchedIds.clear();
      selectedCard = null;
      selectedSide = null;
      lines = [];
      document.getElementById('lines-svg').innerHTML = '';
      document.getElementById('numbers-layer').innerHTML = '';
      document.getElementById('completion-overlay').classList.add('hidden');
      updateScore();
      buildCards();
    }

    function applyConfig(config) {
      const bg = config.background_color || defaultConfig.background_color;
      const surface = config.surface_color || defaultConfig.surface_color;
      const text = config.text_color || defaultConfig.text_color;
      const primary = config.primary_action || defaultConfig.primary_action;
      const secondary = config.secondary_action || defaultConfig.secondary_action;

      const wrapper = document.getElementById('app-wrapper');
      wrapper.style.background = `linear-gradient(135deg, ${bg} 0%, ${adjustColor(bg, -5)} 50%, ${adjustColor(bg, -10)} 100%)`;

      document.getElementById('main-title').textContent = config.main_title || defaultConfig.main_title;
      document.getElementById('main-title').style.color = text;
      document.getElementById('subtitle').style.color = text;
      document.getElementById('subtitle').textContent = config.subtitle || defaultConfig.subtitle;
      document.getElementById('instructions').textContent = config.instructions || defaultConfig.instructions;
      document.getElementById('instructions').style.color = adjustColor(text, 30);

      document.getElementById('score-text').style.color = text;
      document.querySelector('[title="אתחול"]').style.color = text;
      document.getElementById('score-bar').style.background = primary;

      const natureLabel = document.querySelector('#nature-col .rounded-full');
      if (natureLabel) natureLabel.style.background = primary;

      const techLabel = document.querySelector('#tech-col .rounded-full');
      if (techLabel) techLabel.style.background = secondary;

      document.querySelectorAll('.nature-card:not(.matched), .tech-card:not(.matched)').forEach(card => {
        card.style.background = surface;
      });

      document.getElementById('play-again-btn').style.background = primary;
      document.getElementById('continue-btn').style.background = secondary;
      document.getElementById('secret-code-message').textContent = getSecretCodeMessage();
      document.getElementById('secret-code-message').style.color = text;
      redrawLines();
    }

    function adjustColor(hex, amount) {
      hex = String(hex || '').replace('#', '');
      if (hex.length !== 6) return '#1a6b4a';
      const r = Math.max(0, Math.min(255, parseInt(hex.substring(0, 2), 16) + amount));
      const g = Math.max(0, Math.min(255, parseInt(hex.substring(2, 4), 16) + amount));
      const b = Math.max(0, Math.min(255, parseInt(hex.substring(4, 6), 16) + amount));
      return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
    }

    function runSelfTests() {
      console.assert(Array.isArray(SECRET_CODE_NUMBERS), 'SECRET_CODE_NUMBERS must be an array');
      console.assert(SECRET_CODE_NUMBERS.length === 2, 'There must be exactly 2 secret code numbers');
      console.assert(PAIRS.length === 6, 'There must be exactly 6 pairs');
      console.assert(getSecretCodeMessage() === '2 המספרים של הקוד הסודי הם: 3, 4', 'Secret code message format is incorrect');
      const shuffled = shuffleArray(PAIRS);
      console.assert(shuffled.length === PAIRS.length, 'Shuffle must preserve array length');
      console.assert(new Set(shuffled.map(item => item.id)).size === PAIRS.length, 'Shuffle must preserve all pair ids');
    }

    document.getElementById('reset-btn').addEventListener('click', resetGame);
    document.getElementById('play-again-btn').addEventListener('click', resetGame);
    document.getElementById('continue-btn').addEventListener('click', () => {
      document.getElementById('completion-overlay').classList.add('hidden');
      window.parent.postMessage({ type: 'matchComplete', secret: SECRET_CODE_NUMBERS }, '*');
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        generateScatteredNumbers();
        redrawLines();
      }, 120);
    });

    runSelfTests();
    buildCards();
    updateScore();
    document.getElementById('secret-code-message').textContent = getSecretCodeMessage();

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          applyConfig(config);
        },
        mapToCapabilities: (config) => ({
          recolorables: [
            { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
            { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
            { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
            { get: () => config.primary_action || defaultConfig.primary_action, set: (v) => { config.primary_action = v; window.elementSdk.setConfig({ primary_action: v }); } },
            { get: () => config.secondary_action || defaultConfig.secondary_action, set: (v) => { config.secondary_action = v; window.elementSdk.setConfig({ secondary_action: v }); } }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || 'Rubik',
            set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }
          },
          fontSizeable: {
            get: () => config.font_size || 14,
            set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ['main_title', config.main_title || defaultConfig.main_title],
          ['subtitle', config.subtitle || defaultConfig.subtitle],
          ['instructions', config.instructions || defaultConfig.instructions]
        ])
      });
    }

    lucide.createIcons();
  </script>
</body>
</html>
