<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>חדר הבריחה – עולם הביומימיקרי</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:            #07111f;
      --bg-2:          #13284a;
      --panel:         rgba(9, 19, 42, 0.88);
      --panel-light:   rgba(255,255,255,0.06);
      --text:          #eef5ff;
      --muted:         #c4d4ef;
      --accent:        #62d9ff;
      --accent-2:      #88f3b9;
      --title:         #7cf6ff;
      --heading:       #ffe79b;
      --danger:        #ff91a8;
      --warning:       #ffd985;
      --success:       #7effc1;
      --border:        rgba(255,255,255,.14);
      --shadow:        0 18px 40px rgba(0,0,0,.4);
      --radius:        20px;
      --ease:          600ms cubic-bezier(.22,.61,.36,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 8%,  rgba(98,217,255,.18), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(136,243,185,.12), transparent 26%),
        linear-gradient(160deg, var(--bg-2), var(--bg));
      color: var(--text);
      font-family: "Assistant", "Rubik", Arial, sans-serif;
    }

    body { padding: 12px; }

    #app {
      width: min(900px, 100%);
      margin-inline: auto;
      background: rgba(8,14,31,0.44);
      border: 1px solid var(--border);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: var(--shadow);
      min-height: calc(100vh - 24px);
    }

    /* ---- Header ---- */
    #game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(255,255,255,.05);
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 8px;
    }
    #game-header .logo {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--title);
    }
    #progress-bar-outer {
      flex: 1;
      max-width: 260px;
      height: 6px;
      background: rgba(255,255,255,.1);
      border-radius: 99px;
      overflow: hidden;
    }
    #progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 99px;
      transition: width var(--ease);
      width: 0%;
    }

    /* ---- Status bar ---- */
    #status-bar {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 0;
      transition: background .3s;
    }
    #status-bar.error   { background: rgba(255,100,120,.15); color: var(--danger); }
    #status-bar.success { background: rgba(120,255,180,.12); color: var(--success); }
    #status-bar.idle    { background: transparent; color: transparent; }

    /* ---- Main screen ---- */
    #game-screen {
      padding: clamp(16px, 2.8vw, 36px);
      min-height: calc(100vh - 130px);
    }

    /* ---- Cards ---- */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(16px, 2.4vw, 30px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      animation: fadeInUp .5s ease both;
    }
    .card + .card { margin-top: 18px; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- Typography ---- */
    .screen-eyebrow {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .screen-title {
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 800;
      color: var(--title);
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .screen-body {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .hint-box {
      background: rgba(255,215,130,.08);
      border: 1px solid rgba(255,215,130,.2);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.9rem;
      color: var(--warning);
      margin-top: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .badge-code {
      background: rgba(98,217,255,.15);
      border: 1px solid rgba(98,217,255,.3);
      color: var(--accent);
    }
    .code-reveal {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--heading);
      letter-spacing: .1em;
      background: rgba(255,231,155,.1);
      border: 1px solid rgba(255,231,155,.25);
      border-radius: 10px;
      padding: 10px 20px;
      display: inline-block;
      margin: 8px 0;
    }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform .15s, opacity .15s, box-shadow .2s;
      font-family: inherit;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #3db8df);
      color: #07111f;
      box-shadow: 0 4px 18px rgba(98,217,255,.25);
    }
    .btn-primary:hover { box-shadow: 0 6px 24px rgba(98,217,255,.38); }
    .btn-secondary {
      background: var(--panel-light);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: rgba(255,255,255,.1); }
    .btn-success {
      background: linear-gradient(135deg, #5ef5a0, #2ecc71);
      color: #07111f;
      box-shadow: 0 4px 18px rgba(90,240,150,.22);
    }
    .btn-lg { padding: 14px 32px; font-size: 1.1rem; border-radius: 14px; }
    .btn-sm { padding: 8px 16px; font-size: 0.88rem; border-radius: 10px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    /* ---- MCQ Options ---- */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    @media (max-width: 500px) { .options-grid { grid-template-columns: 1fr; } }
    .option-img-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .option-img-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 10px 14px;
      background: var(--panel-light);
      border: 2px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: border-color .2s, background .2s, transform .12s;
    }
    .option-img-card:hover { border-color: var(--accent); background: rgba(98,217,255,.08); transform: translateY(-3px); }
    .option-img-card img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 10px;
    }
    .option-img-card .opt-letter {
      min-width: 28px;
      height: 28px;
      background: rgba(98,217,255,.15);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .82rem;
      font-weight: 800;
      color: var(--accent);
    }

    /* ── קריינות + ספירה לאחור ── */
    .narration-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 8, 20, 0.82);
      backdrop-filter: blur(6px);
      animation: fadeIn .4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .narration-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 28px 32px;
    }

    .narration-wave {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      height: 52px;
    }
    .narration-wave span {
      display: block;
      width: 8px;
      border-radius: 4px;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(98,217,255,.55);
      animation: narrationBar 1.1s ease-in-out infinite;
    }
    .narration-wave span:nth-child(1) { height: 22px; animation-delay: 0s;    }
    .narration-wave span:nth-child(2) { height: 40px; animation-delay: .15s;  }
    .narration-wave span:nth-child(3) { height: 52px; animation-delay: .3s;   }
    .narration-wave span:nth-child(4) { height: 40px; animation-delay: .45s;  }
    .narration-wave span:nth-child(5) { height: 22px; animation-delay: .6s;   }
    @keyframes narrationBar {
      0%, 100% { transform: scaleY(1);    opacity: .7; }
      50%       { transform: scaleY(1.8); opacity: 1;  }
    }

    .narration-text {
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      color: var(--text);
      letter-spacing: .06em;
      text-align: center;
    }

    .narration-skip-btn {
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      color: var(--muted);
      font-size: .92rem;
      padding: 9px 22px;
      border-radius: 12px;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .narration-skip-btn:hover {
      background: rgba(255,255,255,.18);
      color: var(--text);
    }

    .narration-cnum {
      font-size: clamp(3.5rem, 12vw, 8rem);
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
      text-shadow: 0 0 30px rgba(98,217,255,.86);
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--panel-light);
      border: 2px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 0.97rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-align: right;
      transition: border-color .2s, background .2s, transform .12s;
    }
    .option-btn:hover { border-color: var(--accent); background: rgba(98,217,255,.08); transform: translateY(-2px); }
    .option-btn .opt-letter {
      min-width: 30px;
      height: 30px;
      background: rgba(98,217,255,.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--accent);
    }

    /* ---- Door Screen ---- */
    .door-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px;
    }
    .door-icon {
      font-size: 5rem;
      animation: doorPulse 2s ease-in-out infinite;
    }
    @keyframes doorPulse {
      0%,100% { filter: drop-shadow(0 0 8px rgba(98,217,255,.4)); }
      50%      { filter: drop-shadow(0 0 22px rgba(98,217,255,.8)); }
    }
    .door-codes-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 10px 0;
    }

    /* ---- Code Input ---- */
    .code-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .code-input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255,255,255,.06);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
      font-family: inherit;
      text-align: center;
      letter-spacing: .12em;
      transition: border-color .2s;
      max-width: 200px;
    }
    .code-input:focus { outline: none; border-color: var(--accent); }
    .code-input::placeholder { color: rgba(255,255,255,.25); font-size: 0.9rem; letter-spacing: normal; }

    /* ---- Habitat Flip Cards (Step 3) ---- */
    .habitat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 14px;
      margin-top: 18px;
    }
    .habitat-card-wrap {
      perspective: 900px;
      cursor: pointer;
      height: 170px;
    }
    .habitat-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(.4,0,.2,1);
    }
    .habitat-card.flipped { transform: rotateY(180deg); }
    .habitat-card-front, .habitat-card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: 2px solid var(--border);
    }
    .habitat-card-front {
      background: var(--card-bg);
      gap: 6px;
    }
    .habitat-card-front img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
    }
    .habitat-card-front .hcard-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
    }
    .habitat-card-back {
      background: linear-gradient(135deg, rgba(98,217,255,.15), rgba(136,243,185,.15));
      border-color: var(--accent);
      transform: rotateY(180deg);
      text-align: center;
      padding: 14px 10px;
      gap: 8px;
    }
    .habitat-card-back strong { font-size: 13px; color: var(--accent); }
    .habitat-card-back p { font-size: 11.5px; color: var(--text-muted); margin: 0; line-height: 1.5; }
    .habitat-card-wrap.must-flip { animation: cardPulse 1s ease 3; }
    @keyframes cardPulse {
      0%,100% { filter: drop-shadow(0 0 4px rgba(255,160,90,.0)); }
      50%      { filter: drop-shadow(0 0 12px rgba(255,160,90,.9)); }
    }
    .habitat-hint {
      text-align: center;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 16px;
      animation: fadeIn .5s ease;
    }
    .habitat-mcq { margin-top: 22px; }
    .habitat-mcq .option-btn { width: 100%; margin-bottom: 10px; }

    /* ---- Immersive Door Screen ---- */
    /* ===== VAULT DOOR IMMERSIVE SCREENS ===== */
    .vault-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 36px 20px 28px;
      background:
        radial-gradient(ellipse 80% 60% at 50% 30%, rgba(98,217,255,.10) 0%, transparent 65%),
        radial-gradient(ellipse 60% 80% at 50% 90%, rgba(136,243,185,.07) 0%, transparent 60%);
      border-radius: 24px;
      border: 1.5px solid rgba(98,217,255,.14);
      position: relative;
      overflow: hidden;
    }
    .vault-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 38px,
        rgba(98,217,255,.025) 38px,
        rgba(98,217,255,.025) 40px
      );
      pointer-events: none;
    }
    .vault-eyebrow {
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: .75;
    }
    .vault-lock {
      font-size: 6rem;
      animation: doorPulse 2.4s ease-in-out infinite;
      filter: drop-shadow(0 0 28px rgba(98,217,255,.65)) drop-shadow(0 0 8px rgba(136,243,185,.4));
      line-height: 1;
    }
    .vault-lock.vault-open {
      animation: bounceIn .55s ease forwards;
      filter: drop-shadow(0 0 36px rgba(136,243,185,.85));
    }
    .vault-title {
      font-size: 1.22rem;
      font-weight: 800;
      color: var(--text);
      text-align: center;
      letter-spacing: .02em;
    }
    .vault-subtitle {
      font-size: .83rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: -8px;
    }
    /* Clue cards row */
    .vault-clues {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .vault-clue {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255,255,255,.05);
      border: 1.5px solid rgba(98,217,255,.22);
      border-radius: 14px;
      padding: 8px 14px;
      min-width: 66px;
    }
    .vault-clue-label {
      font-size: .65rem;
      letter-spacing: .1em;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .vault-clue-val {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1.1;
    }
    .vault-clue.missing .vault-clue-val { color: var(--danger); font-size: 1.1rem; }
    /* Digit inputs */
    .vault-digits {
      display: flex;
      gap: 12px;
      align-items: center;
      direction: ltr;
    }
    .vault-digit {
      width: 62px;
      height: 72px;
      background: rgba(98,217,255,.06);
      border: 2.5px solid rgba(98,217,255,.3);
      border-radius: 16px;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--accent);
      text-align: center;
      caret-color: var(--accent);
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    .vault-digit:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(98,217,255,.2), 0 0 18px rgba(98,217,255,.3);
    }
    .vault-digit-sep {
      font-size: 2rem;
      color: rgba(98,217,255,.4);
      font-weight: 200;
      line-height: 1;
    }
    /* Unlock button */
    .vault-btn {
      margin-top: 4px;
      padding: 15px 50px;
      font-size: 1.1rem;
      font-weight: 800;
      font-family: inherit;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0a1520;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: .04em;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 20px rgba(98,217,255,.3);
    }
    .vault-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(98,217,255,.5); }
    .vault-btn:active { transform: scale(.97); }
    /* Shake on wrong */
    .vault-shake { animation: wrongShake .5s ease; }
    /* Already-open state */
    .vault-open-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn .5s ease;
    }
    .vault-open-icon { font-size: 5.5rem; animation: bounceIn .6s ease; }
    .vault-warning {
      color: var(--danger);
      font-weight: 700;
      text-align: center;
      font-size: .9rem;
    }
    /* Backward compat kept for step 3 / other screens */
    .door-immersive {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 32px 24px;
      background: radial-gradient(ellipse at center, rgba(98,217,255,.07) 0%, transparent 70%);
      border-radius: 22px;
    }
    .door-submit-btn {
      margin-top: 8px;
      padding: 14px 44px;
      font-size: 1.1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0d1a26;
      border: none;
      border-radius: 40px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      font-family: inherit;
    }
    .door-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(98,217,255,.35); }
    .door-unlock-success {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fadeIn .5s ease;
    }
    .door-unlock-icon { font-size: 5rem; animation: bounceIn .6s ease; }
    @keyframes bounceIn {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    .door-shake { animation: wrongShake .5s ease; }

    /* ---- DYK Screen ---- */
    .dyk-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 28px 24px;
      text-align: center;
    }
    .dyk-image {
      width: 100%;
      max-width: 320px;
      border-radius: 18px;
      object-fit: cover;
      max-height: 220px;
      box-shadow: 0 8px 28px rgba(0,0,0,.4);
    }
    .dyk-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0d1a26;
      font-weight: 800;
      padding: 4px 18px;
      border-radius: 40px;
      font-size: 0.85rem;
      letter-spacing: .05em;
    }
    .dyk-text {
      font-size: 1rem;
      color: var(--text);
      line-height: 1.7;
      max-width: 520px;
    }

    /* ---- Step 5: Matching Game ---- */
    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

<script>
"use strict";

/* ============================================================
   IFRAME OVERLAY – matching & final cipher
   ============================================================ */

function showIframe(src) {
  const overlay = document.getElementById('iframe-overlay');
  const frame   = document.getElementById('iframe-content');
  frame.src     = src;
  overlay.style.display = 'block';
}

function hideIframe() {
  const overlay = document.getElementById('iframe-overlay');
  const frame   = document.getElementById('iframe-content');
  overlay.style.display = 'none';
  frame.src = '';
}

window.addEventListener('message', (event) => {
  if (!event.data || typeof event.data !== 'object') return;

  if (event.data.type === 'matchComplete') {
    hideIframe();
    solveStep5([]);
  }

  if (event.data.type === 'cipherComplete') {
    hideIframe();
    showActualFinalScreen();
  }
});

/* ============================================================
   PERSISTENCE
   ============================================================ */

function saveGameState() {
  const snapshot = {
    currentScreen: gameState.currentScreen,
    player:        { ...gameState.player },
    progress:      { ...gameState.progress },
    codes:         { ...gameState.codes },
    answers:       { ...gameState.answers },
    _attempts:     { ...gameState._attempts },
  };
  sessionStorage.setItem("bioroom_game_state", JSON.stringify(snapshot));
}

function loadGameState() {
  const raw = sessionStorage.getItem("bioroom_game_state");
  if (!raw) return false;
  try {
    const parsed = JSON.parse(raw);
    gameState.currentScreen = parsed.currentScreen || "name_entry";
    if (parsed.player)    Object.assign(gameState.player,    parsed.player);
    if (parsed._attempts) Object.assign(gameState._attempts, parsed._attempts);
    Object.assign(gameState.progress, parsed.progress || {});
    Object.assign(gameState.codes,    parsed.codes    || {});
    Object.assign(gameState.answers,  parsed.answers  || {});
    /* אם אין שם שמור, תמיד חזור למסך הזנת שם */
    if (!gameState.player.name) gameState.currentScreen = "name_entry";
    return true;
  } catch (e) {
    return false;
  }
}

function clearSavedState() {
  sessionStorage.removeItem("bioroom_game_state");
}

/* ============================================================
   NAVIGATION – פונקציית ניווט יחידה
   ============================================================ */

function goToScreen(screenName) {
  gameState.currentScreen = screenName;
  gameState.ui.hintOpen    = false;
  clearStatus();
  saveGameState();
  renderCurrentScreen();
  updateHeader();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================================================
   STATUS – שגיאה / הצלחה
   ============================================================ */

function showError(message) {
  gameState.ui.errorMessage   = message;
  gameState.ui.successMessage = "";
  renderStatus();
}

function showSuccess(message) {
  gameState.ui.successMessage = message;
  gameState.ui.errorMessage   = "";
  renderStatus();
  /* ✨ magic burst */
  if (typeof window.triggerMagicBurst === 'function') {
    window.triggerMagicBurst(window.innerWidth / 2, window.innerHeight / 2);
  }
}

function clearStatus() {
  gameState.ui.errorMessage   = "";
  gameState.ui.successMessage = "";
  renderStatus();
}

function renderStatus() {
  const bar = document.getElementById("status-bar");
  if (!bar) return;
  if (gameState.ui.errorMessage) {
    bar.textContent = "⚠️ " + gameState.ui.errorMessage;
    bar.className   = "error";
  } else if (gameState.ui.successMessage) {
    bar.textContent = "✅ " + gameState.ui.successMessage;
    bar.className   = "success";
  } else {
    bar.textContent = "";
    bar.className   = "idle";
  }
}

function escapeHTML(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setScreen(html) {

  if (!gameState.progress.step5Solved) {
    showError("אי אפשר לפתוח שלב זה לפני השלמת שלב 5.");
    return;
  }
  const numericCount = Number(submittedCount);
  if (isNaN(numericCount) || numericCount <= 0) {
    showError("הזינו מספר חוקי.");
    return;
  }
  if (numericCount !== STEP_6_CORRECT_COUNT) {
    gameState._attempts.step6++;
    showError(attemptsErrorMsg('step6'));
    return;
  }
  gameState.answers.step6SubmittedCount  = numericCount;
  gameState.codes.step6ElementCount      = numericCount;
  gameState.progress.step6Solved         = true;
  saveGameState();
  const { pts: p6, wrong: w6 } = scoreStep('step6', STEP_SCORES.step6);
  showSuccess(`נכון! מספר האלמנטים נשמר. ${scoreSuffix(p6, w6)}`);
  setTimeout(() => goToScreen("door_2"), 1400);
}

/* ============================================================
   DOOR 2 LOGIC
   ============================================================ */

function buildDoor2Code() {
  const d1    = gameState.codes.step5Digit1;
  const d2    = gameState.codes.step5Digit2;
  const count = gameState.codes.step6ElementCount;
  if (d1 === null || d2 === null || count === null) return null;
  return `${d1}${d2}${count}`;
}

function prepareDoor2Code() {
  const code = buildDoor2Code();
  if (!code) {
    showError("אין מספיק נתונים לבניית הקוד.");
    return null;
  }
  gameState.codes.door2Code = code;
  return code;
}

function unlockDoor2(submittedCode) {
  if (!gameState.progress.step6Solved) {
    showError("אי אפשר לפתוח את הדלת לפני השלמת שלב 6.");
    return;
  }
  const expectedCode = prepareDoor2Code();
  if (!expectedCode) return;
  if (String(submittedCode).trim() !== String(expectedCode)) {
    showError("הקוד שגוי. בדקו את שתי הספרות ומספר האלמנטים.");
    return;
  }
  gameState.progress.door2Unlocked = true;
  saveGameState();
  showSuccess("הדלת נפתחה! ממשיכים...");
  setTimeout(() => goToScreen("door_2_dyk"), 1500);
}

  try {
    const params = new URLSearchParams({ action, roomId: ROOM_ID, ...data });
    await fetch(APPS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params.toString(),
    });
  } catch (e) { /* offline – ignore */ }
}

async function apiGet(action, extra = {}) {
  try {
    const qs = new URLSearchParams({ action, roomId: ROOM_ID, ...extra });
    const r  = await fetch(`${APPS_URL}?${qs}`, { cache: 'no-store' });
    return r.json();
  } catch { return null; }
}

/* ============================================================
   SCORING HELPER  (מחשב נקודות לפי מספר ניסיונות שגויים)
   ============================================================ */

/**
 * מחזיר: { pts, multiplier, wrong }
 *   wrong=0 → מכפיל 1.0  (ניקוד מלא)
 *   wrong=1 → מכפיל 0.5  (חצי ניקוד – ניסיון שני)
 *   wrong≥2 → מכפיל 0    (אפס ניקוד – ניסיון שלישי+)
 */
function scoreStep(stepKey, maxPts) {
  const wrong      = gameState._attempts[stepKey] || 0;
  const multiplier = wrong === 0 ? 1.0 : wrong === 1 ? 0.5 : 0.0;
  const pts        = Math.round(maxPts * multiplier);
  gameState.player.score += pts;
  apiPost('gamescore', {
    name:  gameState.player.name,
    score: String(gameState.player.score),
    step:  stepKey,
  });
  return { pts, multiplier, wrong };
}

/** מחזיר טקסט ניקוד לתוך הודעת ההצלחה */
function scoreSuffix(pts, wrong) {
  if (wrong === 0) return `✨ +${pts} נקודות`;
  if (wrong === 1) return `⚡ +${pts} נקודות (חצי ניקוד – ניסיון שני)`;
  return `⚠️ +0 נקודות (ניסיון שלישי+)`;
}

/** הודעת שגיאה לפי מספר ניסיונות שגויים שנצברו (AFTER increment) */
function attemptsErrorMsg(stepKey) {
  const count = gameState._attempts[stepKey] || 0;
  /* count=1: שגיאה ראשונה – הניסיון הבא יזכה בחצי ניקוד */
  if (count === 1) return "לא נכון ❌ — שגיאה ראשונה! תשובה נכונה בניסיון הבא תזכה בחצי ניקוד בלבד.";
  /* count=2: שגיאה שנייה – כבר לא יזכה בניקוד */
  if (count === 2) return "לא נכון ⚠️ — שגיאה שנייה. פתרון נכון מכאן לא יזכה בניקוד.";
  /* count≥3: ממשיכים לנסות, ללא ניקוד */
  return "לא נכון 😔 — נסו שוב. לא ייזקף ניקוד על שאלה זו.";
}

/* ============================================================
   קריינות + ספירה לאחור
   ============================================================ */
function startCountdownWithNarration() {
  /* מניעת קריאה כפולה */
  if (document.getElementById('narration-overlay')) return;

  const overlay = document.createElement('div');
  overlay.id        = 'narration-overlay';
  overlay.className = 'narration-overlay';
  overlay.innerHTML = `
    <div class="narration-content">
      <div class="narration-wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="narration-text" id="narration-label">מאזינים לסיפור המסגרת...</p>
      <div class="narration-cnum" id="narration-cnum" style="display:none">10</div>
      <button class="narration-skip-btn" id="narration-skip">דלגו ←</button>
    </div>
  `;
  document.body.appendChild(overlay);

  const audio    = new Audio('audio/narration.m4a');
  let intervalId = null;
  let started    = false;

  function stopAudio() {
    try { audio.pause(); audio.src = ''; } catch(e) {}
  }

  function finishAndStart() {
    clearInterval(intervalId);
    stopAudio();
    overlay.remove();
    goToScreen('step_1_identification');
  }

  function runCountdown() {
    if (started) return;
    started = true;

    const numEl   = document.getElementById('narration-cnum');
    const labelEl = document.getElementById('narration-label');
    const waveEl  = overlay.querySelector('.narration-wave');
    if (labelEl) labelEl.textContent = 'המשחק מתחיל בעוד...';
    if (numEl)   { numEl.style.display = 'block'; numEl.textContent = 10; }
    if (waveEl)  waveEl.style.display = 'none';

    let sec = 10;
    intervalId = setInterval(() => {
      sec--;
      if (numEl) numEl.textContent = sec;
      if (sec <= 0) finishAndStart();
    }, 1000);
  }

  /* canplaythrough בלבד — מופעל רק פעם אחת אחרי שהאודיו טעון */
  audio.addEventListener('canplaythrough', function onReady() {
    audio.removeEventListener('canplaythrough', onReady);
    if (started) return;
    const dur   = audio.duration;
    const delay = (Number.isFinite(dur) && dur > 10) ? (dur - 10) * 1000 : 0;
    setTimeout(runCountdown, delay);
  });

  audio.onerror = () => { if (!started) runCountdown(); };
  audio.onended = () => { if (!started) runCountdown(); };

  document.getElementById('narration-skip').addEventListener('click', () => {
    started = true;
    finishAndStart();
  });

  audio.play().catch(() => { if (!started) runCountdown(); });
}

window.step5SelectCard = function(pairId, side) {
  const s5 = gameState._step5;
  const matchedIds = new Set(s5.matchedIds);

  if (matchedIds.has(pairId)) return;

  /* ביטול בחירה זהה */
  if (s5.selectedSide === side && s5.selectedCard === pairId) {
    s5.selectedCard = null;
    s5.selectedSide = null;
    renderStep5();
    return;
  }

  /* אותו צד – מחליף בחירה */
  if (s5.selectedSide === side) {
    s5.selectedCard = pairId;
    renderStep5();
    return;
  }

  /* שני צדדים נבחרו – בדיקת התאמה */
  if (s5.selectedSide !== null && s5.selectedSide !== side) {
    const natureId = s5.selectedSide === "nature" ? s5.selectedCard : pairId;
    const techId   = s5.selectedSide === "tech"   ? s5.selectedCard : pairId;

    s5.selectedCard = null;
    s5.selectedSide = null;

    if (natureId === techId) {
      /* התאמה נכונה */
      const newMatchedIds = [...matchedIds, natureId];
      s5.matchedIds = newMatchedIds;

      const pair = gameData.step5.pairs.find(p => p.id === natureId);
      if (pair) showSuccess(`✓ ${pair.info}`);

      if (newMatchedIds.length === gameData.step5.pairs.length) {
        /* כל ההתאמות הושלמו */
        setTimeout(() => {
          solveStep5(newMatchedIds.map(id => {
            const p = gameData.step5.pairs.find(x => x.id === id);

/* ---- Step 8: Cipher ---- */
/* ---------- נתוני שלב 8 ---------- */
const S8_CIPHER_MAP = {
  1:'א',2:'ב',3:'ג',4:'ד',5:'ה',6:'ו',7:'ז',8:'ח',9:'ט',
  10:'י',11:'כ',12:'ל',13:'מ',14:'נ',15:'ס',16:'ע',17:'פ',
  18:'צ',19:'ק',20:'ר',21:'ש',22:'ת'
};
const S8_WORDS        = ['השראה','מן','הטבע'];
const S8_FINAL_FORMS  = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
/* S8_FLAT מנורמל לצורות רגילות (לא סופיות) כדי להתאים לקלט המנורמל */
const S8_FLAT         = S8_WORDS.join('').split('').map(c => S8_FINAL_FORMS[c] || c).join('');

function s8NormChar(ch) {
  const c = (ch || '').trim().slice(-1);
  if (!/^[א-תךםןףץ]$/.test(c)) return '';
  return S8_FINAL_FORMS[c] || c;
}

      animationDuration: `${2.1 + Math.random() * 1.3}s`

}

function step8Init() {
  /* ---- מפתח ---- */
  const keyGrid = document.getElementById('s8-key-grid');
  if (keyGrid) {
    Object.entries(S8_CIPHER_MAP).forEach(([num, letter]) => {
      const item = document.createElement('div');
      item.className = 's8-key-item';
      item.innerHTML = `<strong>${num}</strong><span>${letter}</span>`;
      keyGrid.appendChild(item);
    });
  }

  const boxes      = Array.from(document.querySelectorAll('.s8-letter-box'));
  const checkBtn   = document.getElementById('s8-check-btn');
  const clearBtn   = document.getElementById('s8-clear-btn');
  const continueBtn= document.getElementById('s8-continue-btn');
  const modal      = document.getElementById('s8-modal');
  const statusCard = document.getElementById('s8-status-card');

  if (!boxes.length || !checkBtn) return;

  const hebrewPat = /^[א-תךםןףץ]$/;

  function setStatus(msg, type) {
    if (!statusCard) return;
    statusCard.classList.remove('success','error');
    if (type) statusCard.classList.add(type);
    statusCard.innerHTML = msg;
  }

  function openModal() {
    if (!modal) return;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
    s8BurstConfetti();
  }

  function closeModal() {
    if (!modal) return;
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden','true');
  }

  function moveFwd(i) { if (i < boxes.length - 1) { boxes[i+1].focus(); boxes[i+1].select(); } }
  function moveBwd(i) { if (i > 0)               { boxes[i-1].focus(); boxes[i-1].select(); } }

  boxes.forEach((box, i) => {
    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace') {
        if (box.value) {
          box.value = '';
          box.classList.remove('filled','error','success');
        } else {
          moveBwd(i);
          if (i > 0) { boxes[i-1].value = ''; boxes[i-1].classList.remove('filled','error','success'); }
        }
        e.preventDefault(); return;
      }
      if (e.key === 'ArrowLeft')  { moveFwd(i); e.preventDefault(); return; }
      if (e.key === 'ArrowRight') { moveBwd(i); e.preventDefault(); return; }
      if (e.key.length === 1 && hebrewPat.test(e.key)) {
        box.value = s8NormChar(e.key);
        box.classList.add('filled');
        box.classList.remove('error','success');
        moveFwd(i);
        e.preventDefault();
      }
    });

    box.addEventListener('input', () => {
      const n = s8NormChar(box.value);
      box.value = n;
      box.classList.toggle('filled', !!n);
      box.classList.remove('error','success');
      if (n) moveFwd(i);
    });

    box.addEventListener('focus', () => box.select());

    box.addEventListener('paste', e => {
      e.preventDefault();
      const chars = Array.from((e.clipboardData || window.clipboardData).getData('text'))
        .map(s8NormChar).filter(Boolean);
      let cur = i;
      chars.forEach(ch => {
        if (cur >= boxes.length) return;
        boxes[cur].value = ch;
        boxes[cur].classList.add('filled');
        boxes[cur].classList.remove('error','success');
        cur++;
      });
      const fi = Math.min(cur, boxes.length - 1);
      boxes[fi].focus(); boxes[fi].select();
    });
  });

  checkBtn.addEventListener('click', () => {
    boxes.forEach(b => b.classList.remove('success','error'));
    const entered = boxes.map(b => s8NormChar(b.value)).join('');

    if (entered.length !== S8_FLAT.length) {
      setStatus('יש למלא את כל התיבות לפני הבדיקה.', 'error');
      boxes.filter(b => !s8NormChar(b.value)).forEach(b => b.classList.add('error'));
      return;
    }

    if (entered === S8_FLAT) {
      boxes.forEach((b, i) => setTimeout(() => b.classList.add('success'), i * 45));
      openModal();
      return;
    }

    boxes.forEach((b, i) => b.classList.add(s8NormChar(b.value) === S8_FLAT[i] ? 'success' : 'error'));
    setStatus('הפתרון אינו נכון. בדקו שוב את התאמת המספרים לאותיות ונסו מחדש.', 'error');
  });

  clearBtn.addEventListener('click', () => {
    boxes.forEach(b => { b.value = ''; b.classList.remove('filled','success','error'); });
    closeModal();
    setStatus('מלאו את התיבות לפי הסדר וגלו את המשפט הסודי.');
    boxes[0].focus();
  });

  if (continueBtn) {
    continueBtn.addEventListener('click', () => {
      closeModal();
      solveStep8();
    });
  }

  if (modal) {
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  }

  document.addEventListener('keydown', function s8Escape(e) {
    if (e.key === 'Escape') closeModal();
    if (gameState.currentScreen !== 'step_8_cipher') {
      document.removeEventListener('keydown', s8Escape);
    }
  });

  boxes[0]?.focus();
}

        <button class="btn btn-primary" onclick="restartGame()">התחילו מחדש</button>
      </div>
    </div>
  `);
}

/* ============================================================
   RESTART
   ============================================================ */

window.restartGame = function() {
  clearSavedState();
  gameState.currentScreen = "name_entry";
  gameState.player.name   = '';
  gameState.player.score  = 0;
  Object.assign(gameState._attempts, { step1:0, step2:0, step3:0, step5:0, step6:0, step8:0 });
  Object.assign(gameState.progress, {
    step1Solved: false, step2Solved: false, step3Solved: false,
    door1Unlocked: false, step5Solved: false, step6Solved: false,
    door2Unlocked: false, step8Solved: false, gameCompleted: false
  });
  Object.assign(gameState.codes, {
    codeStep1: null, codeStep2: null, codeStep3: null,
    step5Digit1: null, step5Digit2: null,
    step6ElementCount: null, door2Code: null
  });
  Object.assign(gameState.answers, {
    step1SelectedAnswer: null, step2SelectedAnswer: null, step3SelectedAnswer: null,
    step5Matches: [], step6SubmittedCount: null, step8SubmittedCipher: null
  });
  gameState._step3.flippedIds           = [];
  gameState._step3.mustFlipBeforeRetry  = false;
  gameState._step5.selectedCard = null;
  gameState._step5.selectedSide = null;
  gameState._step5.matchedIds   = [];
  clearStatus();
  goToScreen("step_1_identification");
};

/* ============================================================
   INIT
   ============================================================ */

document.addEventListener("DOMContentLoaded", function() {
  const loaded = loadGameState();
  if (!loaded) {
    gameState.currentScreen = "name_entry";
  }
  updateHeader();
  renderCurrentScreen();
});
</script>

<!-- ✨ Magical Biomimicry Atmosphere ✨ -->
<script>
(function bioMagic() {
  /* --- Firefly sparkles --- */
  const sparks = document.getElementById('bio-sparks');
  const SPARK_COLORS = [
    'rgba(98,217,255,',   // cyan
    'rgba(136,243,185,',  // mint
    'rgba(255,231,155,',  // gold
    'rgba(210,160,255,',  // violet
    'rgba(80,220,180,',   // teal
  ];

  function createSpark() {
    const el = document.createElement('div');
    el.className = 'spark';
    const size  = 2 + Math.random() * 5;
    const color = SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)];
    const dur   = 8 + Math.random() * 18;
    const delay = Math.random() * -20;
    const glow  = size * 3;
    Object.assign(el.style, {
      width:  size + 'px',
      height: size + 'px',
      left:   Math.random() * 100 + 'vw',
      bottom: '-10px',
      background: color + '0.9)',
      boxShadow: `0 0 ${glow}px ${glow/2}px ${color}0.4)`,
      animationDuration:  dur + 's',
      animationDelay:     delay + 's',
    });
    sparks.appendChild(el);
    setTimeout(() => el.remove(), (dur + Math.abs(delay)) * 1000 + 200);
  }

  /* spawn 35 initial sparks, then keep adding */
  for (let i = 0; i < 35; i++) {
    setTimeout(createSpark, i * 400);
  }
  setInterval(createSpark, 600);

  /* --- Floating bio runes (nature emojis) --- */
  const runes = document.getElementById('bio-runes');
  const BIO_RUNES = ['🧬','🍃','🌿','🦠','🔬','⚗️','🌱','🕸️','🐾','🦋','🌾','🔮'];

  function createRune() {
    const el   = document.createElement('span');
    el.className = 'bio-rune';
    el.textContent = BIO_RUNES[Math.floor(Math.random() * BIO_RUNES.length)];
    const dur  = 22 + Math.random() * 28;
    const delay = Math.random() * -15;
    Object.assign(el.style, {
      left:               Math.random() * 100 + 'vw',
      bottom:             '-60px',
      fontSize:           (1.2 + Math.random() * 1.8) + 'rem',
      opacity:            0.04 + Math.random() * 0.05,
      animationDuration:  dur + 's',
      animationDelay:     delay + 's',
    });
    runes.appendChild(el);
    setTimeout(() => el.remove(), (dur + Math.abs(delay)) * 1000 + 500);
  }

  for (let i = 0; i < 14; i++) setTimeout(createRune, i * 1200);
  setInterval(createRune, 2200);

  /* --- Magic burst on success --- */
  const burst = document.getElementById('magic-burst');
  const BURST_COLORS = ['#62d9ff','#88f3b9','#ffd76a','#c080ff','#ffffff','#5ef5a0'];

  window.triggerMagicBurst = function(x, y) {
    for (let i = 0; i < 22; i++) {
      const p   = document.createElement('div');
      p.className = 'burst-particle';
      const size  = 4 + Math.random() * 8;
      const angle = Math.random() * Math.PI * 2;
      const dist  = 60 + Math.random() * 140;
      const bx    = Math.cos(angle) * dist;
      const by    = Math.sin(angle) * dist;
      Object.assign(p.style, {
        width:    size + 'px',
        height:   size + 'px',
        left:     (x - size / 2) + 'px',
        top:      (y - size / 2) + 'px',
        background: BURST_COLORS[Math.floor(Math.random() * BURST_COLORS.length)],
        boxShadow: `0 0 ${size*2}px ${BURST_COLORS[Math.floor(Math.random() * BURST_COLORS.length)]}`,
        '--bx':   bx + 'px',
        '--by':   by + 'px',
        animationDuration: (.5 + Math.random() * .6) + 's',
        animationDelay:    (Math.random() * .15) + 's',
      });
      burst.appendChild(p);
      setTimeout(() => p.remove(), 1200);
    }
  };

  /* Cursor sparkle trail */
  let lastTrail = 0;
  document.addEventListener('mousemove', function(e) {
    const now = Date.now();
    if (now - lastTrail < 90) return;
    lastTrail = now;
    if (Math.random() > 0.5) return; /* skip some for subtlety */
    const p = document.createElement('div');
    p.className = 'spark';
    const size  = 2 + Math.random() * 3;
    const color = SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)];
    Object.assign(p.style, {
      width:  size + 'px',
      height: size + 'px',
      left:   e.clientX + 'px',
      top:    e.clientY + 'px',
      position: 'fixed',
      bottom: 'auto',
      background: color + '0.9)',
      boxShadow: `0 0 ${size*4}px ${color}0.6)`,
      animationDuration: '1.5s',
      animationDelay: '0s',
      zIndex: 9998,
    });
    sparks.appendChild(p);
    setTimeout(() => p.remove(), 1600);
  });
})();
</script>

<script>
/* ── מעבר סתרים: 3 לחיצות על הלוגו → admin.html ── */
(function() {
  let clicks = 0, timer = null;
  const logo = document.getElementById('secret-logo');
  if (!logo) return;
  logo.addEventListener('click', function() {
    clicks++;
    clearTimeout(timer);
    if (clicks >= 3) {
      clicks = 0;
      const adminPath = location.pathname.replace(/bioroom\.html$/, 'admin.html');
      location.href = adminPath;
      return;
    }
    timer = setTimeout(() => { clicks = 0; }, 2000);
  });
})();
</script>
